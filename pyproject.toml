[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sturdytools"
version = "0.1.0"
description = "Retries, timeouts, rate limits and circuit breakers for AI agent tools"
readme = "README.md"
license = "MIT"
authors = [{name = "Meenal Asesh"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai agents", "llm", "tool calling", "function calling", "mcp", "retry", "timeout", "circuit breaker", "rate limit", "resilience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/ai-with-md/sturdytools"
Issues = "https://github.com/ai-with-md/sturdytools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
